# acp-dev deployment for the acp-writer React/PatternFly UI.
# Serves the SPA and proxies /api + /health to the backend monolith.
#
#   oc apply -f acp-writer/ui/deploy/acp-dev.yaml -n <namespace>
#
# Image is built by the acp-writer-react-ui BuildConfig (repo-root context,
# dockerfilePath acp-writer/ui/Containerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acp-dev-react-ui
  labels:
    app.kubernetes.io/name: acp-writer-react-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: cpg-to-acp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: acp-writer-react-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acp-writer-react-ui
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: cpg-to-acp
    spec:
      containers:
        - name: ui
          image: image-registry.openshift-image-registry.svc:5000/ksulayma-cpg-to-acp/acp-writer-react-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            # nginx.conf proxies /api and /health to ${API_URL} (envsubst at startup)
            - name: API_URL
              value: http://acp-dev-writer-acp-writer:8082
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: acp-dev-react-ui
  labels:
    app.kubernetes.io/name: acp-writer-react-ui
    app.kubernetes.io/part-of: cpg-to-acp
spec:
  selector:
    app.kubernetes.io/name: acp-writer-react-ui
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: acp-dev-react-ui
  labels:
    app.kubernetes.io/name: acp-writer-react-ui
    app.kubernetes.io/part-of: cpg-to-acp
spec:
  to:
    kind: Service
    name: acp-dev-react-ui
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
