# acp-writer BFF ↔ React UI contract — FIRST-CUT DRAFT for negotiation
#
# Status: proposal from the UI (Person B) side, derived from "what each screen
# must render → work backward to fields." Person A (BFF/backend) should review,
# push back, and co-own this file. Once agreed, it is the SINGLE SOURCE OF TRUTH:
#   - UI generates types:  npx openapi-typescript acp-writer/api/bff-openapi.yaml -o acp-writer/ui/src/api/types.ts
#   - BFF validates requests/responses against it server-side.
# Neither side hand-maintains a parallel type list, so they can't drift.
#
# Scope: ONLY the UI-facing surface. The BFF's internal endpoints
# (/api/v1/notifications/artifacts-available, /api/v1/notify-review) are
# backend↔SonataFlow/cpg-ingester plumbing and are intentionally out of scope here.
#
# Screen → endpoint → why (the design driver):
#   PatientEntryPage   POST /runs, POST /runs/smart-launch   → start a run, get runId
#   RunListPage        GET  /runs                            → dashboard rows
#   RunDetailPage      GET  /runs/{id} (polled)              → stepper + review gates (THE crux object)
#   Brief/CarePlan     POST /runs/{id}/review/{gate}         → approve / request_changes
#   CarePlanList       GET  /careplans                       → persisted plans (fixes "Patient/"/"Invalid Date")
#   CarePlanReview     GET  /careplans/{id}, PUT .../status  → view-model + approve/reject (fixes #126)
#   SystemStatus       GET  /status                          → engine + KB health
#
# OPEN QUESTIONS (flagged inline with `# OPEN:`) are the things to settle with Person A.

openapi: 3.1.0
info:
  title: acp-writer BFF API (UI contract)
  version: 0.1.0-draft
  description: >
    Backend-for-Frontend contract consumed by the acp-writer React UI. The BFF
    mediates SonataFlow (workflow), MinIO (artifacts/PHI), and the backend service
    pods, and returns UI-shaped view-models so the client never parses FHIR or
    polls raw workflow state.

servers:
  - url: /api/v1
    description: Served behind nginx, which proxies /api/ to the BFF (${BFF_HOST}).

paths:
  /runs:
    get:
      operationId: listRuns
      summary: RunListPage — dashboard of active/recent runs
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/RunStatus' } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: Run summaries, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RunSummary' }
    post:
      operationId: createRun
      summary: PatientEntryPage (file-upload tab) — start a run from an IPS bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ipsBundle]
              properties:
                ipsBundle:
                  type: object
                  description: FHIR IPS Bundle (resourceType=Bundle). BFF stores it in the MinIO PHI bucket.
                  additionalProperties: true
      responses:
        '202':
          description: Run accepted; workflow started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /runs/smart-launch:
    post:
      operationId: createRunFromSmartLaunch
      summary: PatientEntryPage (SMART tab) / LaunchPage — start a run from SMART context
      description: >
        UI passes the resolved SMART context; the BFF does the server-side
        `$summary` fetch (avoids browser CORS with the FHIR server), stores the
        IPS in MinIO, and starts the workflow. Returns the same shape as POST /runs.
        The request shape below assumes the BROWSER completes the token exchange
        and hands the BFF a bearer token — mirroring today's mock-EHR IPS Viewer
        (client_credentials in LaunchPage.tsx). See the two OPEN sub-decisions below.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [iss, patientId, token]
              properties:
                iss: { type: string, description: FHIR server base URL from the launch }
                patientId: { type: string }
                token: { type: string, description: SMART access token (server-side use only) }
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        # OPEN (two coupled sub-decisions — team boundary call, not a UI-only choice):
        #  1. Token exchange: does the BROWSER complete it (today's IPS Viewer
        #     client_credentials pattern) and pass `token` as shaped above, OR does
        #     the BFF complete the exchange itself from {iss, launch, code}? If the
        #     latter, this request body changes (no `token`; carries launch/code).
        #  2. $summary read location: browser or BFF? This draft puts it in the BFF
        #     to avoid browser CORS — but a BFF-side FHIR read sits in TENSION with
        #     the AGENTS.md boundary "acp-writer does not query FHIR servers." That
        #     rule governs the core engine (which never reads FHIR); whether it also
        #     binds the acp-writer BFF must be settled explicitly. The engine's
        #     write-back path (CarePlan out) is unaffected and stays consistent.

  /runs/{runId}:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getRunDetail
      summary: RunDetailPage — stepper + review gate (polled)
      description: >
        The crux object. The UI renders the entire RunDetail screen from this
        response with no second call and no FHIR parsing. Poll until `status`
        is terminal OR an `awaiting_*` gate (then stop auto-advancing and show
        the review panel).
      responses:
        '200':
          description: Full run detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: cancelRun
      summary: Cancel a run (RunDetailPage / RunListPage)
      responses:
        '204': { description: Cancelled }
        '404': { $ref: '#/components/responses/NotFound' }

  /runs/{runId}/review/{gate}:
    post:
      operationId: submitReview
      summary: ReviewActionBar — approve / request_changes at a human gate
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: gate, in: path, required: true, schema: { $ref: '#/components/schemas/ReviewGate' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewAction' }
      responses:
        '202':
          description: Review accepted; workflow resumes. Returns the updated run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Run is not currently awaiting this gate
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /careplans:
    get:
      operationId: listCarePlans
      summary: CarePlanList — persisted care plans
      responses:
        '200':
          description: Care plan summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CarePlanSummary' }

  /careplans/{careplanId}:
    parameters:
      - { name: careplanId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCarePlan
      summary: CarePlanReview — view-model + raw FHIR for the JSON viewer
      responses:
        '200':
          description: Care plan detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarePlanDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /careplans/{careplanId}/status:
    put:
      operationId: updateCarePlanStatus
      summary: CarePlanReview — approve / reject a persisted plan
      parameters:
        - { name: careplanId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, entered-in-error], description: "active = approve; entered-in-error = reject" }
                clinician: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: Updated summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarePlanSummary' }
        '404': { $ref: '#/components/responses/NotFound' }

  /status:
    get:
      operationId: getSystemStatus
      summary: SystemStatus page — aggregate health
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemStatus' }

components:
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    # ---- Enums (the polling/branching backbone — get these right and #125 can't recur) ----
    RunStatus:
      type: string
      description: >
        Drives UI polling. UI keeps polling on `running`; STOPS and shows a review
        panel on `awaiting_*`; STOPS on terminal (`completed`/`failed`/`cancelled`).
      enum: [running, awaiting_brief_review, awaiting_careplan_review, completed, failed, cancelled]

    StepStatus:
      type: string
      enum: [pending, active, done, error, skipped]

    ReviewGate:
      type: string
      enum: [brief, careplan]

    ReviewDecision:
      type: string
      enum: [approve, request_changes]

    StepKey:
      type: string
      description: >
        Stable, ordered pipeline step identifiers. UI maps key → label/icon; do NOT
        hardcode the list in the UI beyond this shared vocabulary. Keys are snake_case
        here and map to the PascalCase SonataFlow state names — the BFF owns the
        state-name → StepKey mapping when deriving `currentStep` from a live instance.
        Verified against acp-writer/deploy/orchestrator/acp-writer-workflow.yaml
        (workflow v0.2.0). The 9 automated steps map 1:1 to real states; the workflow's
        inject/switch plumbing (InitFHIRReview, IncrementFHIRReview, CheckFHIRVerdict)
        is intentionally not surfaced as UI steps.
        # OPEN (backend/workflow): the two HUMAN gates below (review_brief,
        # review_careplan) do NOT yet exist in the SonataFlow workflow — it currently
        # runs straight through with only automated async callbacks. Per spike-b/spike-c
        # they must be added as Callback states that emit an `awaiting_review` marker
        # (mirroring the LLM async-callback pattern) to drive the awaiting_* RunStatus
        # values. This is a workflow work-item for the BFF/backend track, not a UI change.
      enum:
        - scan_patient            # SonataFlow: ScanPatient
        - resolve_guidelines      # SonataFlow: ResolveGuidelines
        - execute_dmn             # SonataFlow: ExecuteDMN
        - retrieve_recommendations # SonataFlow: RetrieveRecommendations
        - compose_plan            # SonataFlow: ComposePlan
        - review_brief            # human gate — NOT YET in workflow (see OPEN above)
        - generate_bundle         # SonataFlow: GenerateBundle (loops with review_fhir, max 4)
        - review_fhir             # SonataFlow: ReviewFHIR (automated LLM review, loops)
        - review_careplan         # human gate — NOT YET in workflow (see OPEN above)
        - write_fhir              # SonataFlow: WriteFHIR
        - done                    # SonataFlow: Done

    # ---- Run objects ----
    RunCreated:
      type: object
      required: [runId, status]
      properties:
        runId: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }

    RunSummary:
      type: object
      description: RunListPage rows.
      required: [runId, status, createdAt]
      properties:
        runId: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        patientName: { type: string, description: Display name resolved by the BFF (never make the UI parse a reference). }
        patientReference: { type: string }
        currentStep: { $ref: '#/components/schemas/StepKey' }
        careplanId: { type: string, description: Present once the run has produced a persisted plan. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PipelineStep:
      type: object
      required: [key, status]
      properties:
        key: { $ref: '#/components/schemas/StepKey' }
        status: { $ref: '#/components/schemas/StepStatus' }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        detail: { type: string, description: Optional human-readable note (e.g. error summary). }

    RunDetail:
      type: object
      description: The full RunDetailPage state.
      required: [runId, status, steps]
      properties:
        runId: { type: string }
        status: { $ref: '#/components/schemas/RunStatus' }
        patient: { $ref: '#/components/schemas/PatientSummary' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/PipelineStep' }
        currentStep: { $ref: '#/components/schemas/StepKey' }
        awaitingReview:
          description: Which human gate is blocking, or null. Mirrors status but convenient for rendering.
          oneOf:
            - { $ref: '#/components/schemas/ReviewGate' }
            - { type: 'null' }
        planningBrief:
          description: >
            Present from the `brief` gate onward (available for read-back after approval,
            not gate-only). The BFF sources it from the durable MinIO PHI artifact
            (`planning_brief_ref`), which survives the whole run. Null only before it is
            composed. NOTE: this view-model flattens the internal PlanningBrief — if the
            review UI needs provenance (per-goal target measure/value, per-activity
            dose/route/frequency, clinical rationale, DMN audit trail), widen BriefGoal/
            BriefActivity accordingly.
          oneOf:
            - { $ref: '#/components/schemas/PlanningBrief' }
            - { type: 'null' }
        carePlan:
          description: Present at the `careplan` gate — the same view-model as CarePlanDetail.
          oneOf:
            - { $ref: '#/components/schemas/CarePlanView' }
            - { type: 'null' }
        careplanId: { type: string }
        error: { $ref: '#/components/schemas/RunError' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RunError:
      type: object
      properties:
        stepKey: { $ref: '#/components/schemas/StepKey' }
        message: { type: string }

    # ---- Patient / clinical view-models (BFF-shaped; UI never parses FHIR) ----
    PatientSummary:
      type: object
      description: Extracted by the BFF (or client for upload) from the IPS bundle.
      properties:
        name: { type: string }
        birthDate: { type: string }
        gender: { type: string }
        patientReference: { type: string }
        conditions: { type: array, items: { $ref: '#/components/schemas/CodedItem' } }
        medications: { type: array, items: { $ref: '#/components/schemas/CodedItem' } }
        allergies: { type: array, items: { $ref: '#/components/schemas/CodedItem' } }
        observations: { type: array, items: { $ref: '#/components/schemas/CodedItem' } }

    CodedItem:
      type: object
      required: [display]
      properties:
        display: { type: string }
        code: { type: string }
        system: { type: string }

    # ---- Planning brief (brief review gate) ----
    PlanningBrief:
      type: object
      description: BriefReviewPanel. Items carry stable IDs so per-item feedback can reference them.
      properties:
        goals: { type: array, items: { $ref: '#/components/schemas/BriefGoal' } }
        activities: { type: array, items: { $ref: '#/components/schemas/BriefActivity' } }
        conflicts: { type: array, items: { $ref: '#/components/schemas/BriefConflict' } }

    BriefGoal:
      type: object
      required: [id, description]
      properties:
        id: { type: string, description: Stable within the run; referenced by ReviewAction feedback. }
        description: { type: string }
        rationale: { type: string }
        sourceCpgId: { type: string }

    BriefActivity:
      type: object
      required: [id, description]
      properties:
        id: { type: string }
        description: { type: string }
        goalId: { type: string, description: Links to the goal it serves. }
        detail: { type: string }

    BriefConflict:
      type: object
      required: [id, description]
      properties:
        id: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        description: { type: string }

    # ---- Care plan (careplan review gate + persisted list/detail) ----
    CarePlanView:
      type: object
      description: >
        View-model reused by CarePlanReviewPanel and CarePlanDetail. Goals/activities/
        conflicts mirror the brief shape so GoalCard/ActivityCard/ConflictAlert render
        both. Raw FHIR is included ONLY for the "View FHIR JSON" viewer.
      properties:
        goals: { type: array, items: { $ref: '#/components/schemas/BriefGoal' } }
        activities: { type: array, items: { $ref: '#/components/schemas/BriefActivity' } }
        conflicts: { type: array, items: { $ref: '#/components/schemas/BriefConflict' } }
        fhirBundle:
          type: object
          description: Raw FHIR bundle for the JSON viewer only. UI does not parse this for display.
          additionalProperties: true

    CarePlanSummary:
      type: object
      description: CarePlanList rows. Fields chosen to fix the "Patient/"/"Invalid Date" bugs.
      required: [id, status]
      properties:
        id: { type: string }
        patientName: { type: string }
        patientReference: { type: string }
        status: { type: string, description: FHIR CarePlan.status (draft, active, entered-in-error, ...). }
        generatedAt: { type: string, format: date-time }
        runId: { type: string, description: Links back to the producing run. }

    CarePlanDetail:
      allOf:
        - { $ref: '#/components/schemas/CarePlanSummary' }
        - type: object
          properties:
            patient: { $ref: '#/components/schemas/PatientSummary' }
            view: { $ref: '#/components/schemas/CarePlanView' }

    # ---- Review submission ----
    ReviewAction:
      type: object
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/ReviewDecision' }
        clinician: { type: string }
        comment: { type: string, description: Overall free-text note. }
        feedback:
          type: array
          description: Per-item feedback (BriefReviewPanel/FeedbackInput). Required-ish when decision=request_changes.
          items: { $ref: '#/components/schemas/FeedbackItem' }

    FeedbackItem:
      type: object
      required: [itemId, comment]
      properties:
        itemId: { type: string, description: References BriefGoal/Activity/Conflict.id (or CarePlanView item id). }
        comment: { type: string }

    # ---- System status ----
    SystemStatus:
      type: object
      properties:
        version: { type: string }
        decisionEngine:
          type: object
          properties:
            available: { type: boolean }
            modelsDeployed: { type: integer }
        knowledgeBase:
          type: object
          properties:
            available: { type: boolean }
            guidelines: { type: integer }
            recommendations: { type: integer }

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        code: { type: string }
